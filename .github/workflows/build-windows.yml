name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/JitenMPC-BE.App/JitenMPC-BE.App.csproj'
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read the application version from the project file.' }
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $expected = 'v${{ steps.version.outputs.app_version }}'
          $actual = '${{ github.event.release.tag_name }}'
          if ($actual -ne $expected) { throw "Release tag '$actual' does not match application version '$expected'." }

      - name: Publish win-x64
        shell: pwsh
        run: >-
          dotnet publish src/JitenMPC-BE.App/JitenMPC-BE.App.csproj
          -c Release -r win-x64 --self-contained true -o publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Copy notices
        shell: pwsh
        run: |
          Copy-Item README.md publish/
          Copy-Item CHANGELOG.md publish/
          Copy-Item THIRD-PARTY-NOTICES.md publish/
          Copy-Item LICENSE-JitenMPV.txt publish/

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/JitenMPC-BE.iss
          options: /DAppVersion=${{ steps.version.outputs.app_version }}

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JitenMPC-BE-win-x64-${{ steps.version.outputs.app_version }}
          path: publish/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JitenMPC-BE-Setup-${{ steps.version.outputs.app_version }}
          path: installer-output/JitenMPC-BE-Setup-v${{ steps.version.outputs.app_version }}.exe

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "installer-output/JitenMPC-BE-Setup-v${{ steps.version.outputs.app_version }}.exe"
          --clobber
